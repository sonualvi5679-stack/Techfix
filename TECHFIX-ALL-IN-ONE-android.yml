name: Build TechFix APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project and build
        run: |
          mkdir app && cd app
          mkdir -p $(dirname package.json)
          cat > package.json <<'EOF_FILE'
          {
            "name": "techfix",
            "version": "1.0.0",
            "private": true,
            "scripts": { "sync": "npx cap sync android", "open": "npx cap open android" },
            "dependencies": { "@capacitor/android": "^6.0.0", "@capacitor/core": "^6.0.0", "@capacitor/geolocation": "^6.0.0" },
            "devDependencies": { "@capacitor/cli": "^6.0.0" }
          }
          EOF_FILE
          mkdir -p $(dirname capacitor.config.json)
          cat > capacitor.config.json <<'EOF_FILE'
          { "appId": "com.techfix.app", "appName": "TechFix", "webDir": "www" }
          EOF_FILE
          mkdir -p $(dirname www/index.html)
          cat > www/index.html <<'EOF_FILE'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>TechFix – Technician App</title>
          <style>
          :root{--bg:#f2f6fb;--card:#fff;--ink:#14213d;--mut:#5b6b85;--pri:#0b6bcb;--ok:#1a9a4a;--bad:#d6334a;--line:#dbe4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#eaf0fb;--mut:#9fb0cc;--pri:#4ba3ff;--line:#26365a}}
          :root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#eaf0fb;--mut:#9fb0cc;--pri:#4ba3ff;--line:#26365a}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
          #app{max-width:640px;margin:0 auto;padding:12px 14px 40px}
          .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}.top h1{font-size:20px;margin:0;flex:1}
          button,select,input,textarea{font:inherit;color:var(--ink)}
          .btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
          .btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.s{padding:8px 12px;font-size:14px}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .big{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 8px;text-align:center;font-weight:800;font-size:15px;cursor:pointer;min-height:112px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:var(--ink)}
          .big span{font-size:34px}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
          input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;margin:4px 0}
          .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
          .mut{color:var(--mut);font-size:14px}.tag{display:inline-block;background:var(--line);border-radius:6px;padding:1px 8px;font-size:12px;margin-right:4px}
          details summary{font-weight:700;cursor:pointer}ul{margin:6px 0;padding-left:20px}.warn{background:#fff3cd;color:#5c4400;border-radius:8px;padding:8px;margin-top:8px;font-size:14px}
          .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}a.btn{display:inline-block;text-decoration:none;text-align:center}
          #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:99px;display:none}
          svg text{fill:var(--ink)}
          </style></head><body><div id="app"></div><div id="toast"></div>
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="cloud.js"></script>
          <script>
          /* TechFix prototype – single file. Data is stored on this device (localStorage). A real launch needs a backend for accounts, live jobs, shops and maps. */
          const $=s=>document.querySelector(s);
          let st={lang:'en',role:'tech',prof:{name:'Ramesh Kumar',phone:'9876500000',area:'City centre',skills:'AC, Refrigerator, Washing machine',exp:6,reviews:[],done:0},jobs:[]};
          try{Object.assign(st,JSON.parse(localStorage.getItem('techfix')||'{}'))}catch(e){}
          const save=()=>{try{localStorage.setItem('techfix',JSON.stringify(st))}catch(e){}if(window.Cloud&&Cloud.on)Cloud.syncJobs(st.jobs)};
          const L={en:{ac:'AC ERROR SEARCH',guide:'REPAIR GUIDE',parts:'NEARBY SPARE PARTS',find:'FIND CUSTOMER JOBS',my:'MY JOBS',prof:'MY PROFILE',book:'BOOK A TECHNICIAN',shop:'REGISTER MY SHOP',back:'Back',ph:'e.g. Samsung AC E6, LG washing machine IE, AC not cooling'},
          hi:{ac:'AC एरर सर्च',guide:'रिपेयर गाइड',parts:'नज़दीकी स्पेयर पार्ट्स',find:'कस्टमर जॉब खोजें',my:'मेरे जॉब',prof:'मेरी प्रोफ़ाइल',book:'टेक्नीशियन बुक करें',back:'वापस',ph:'जैसे Samsung AC E6, AC not cooling'}};
          const t=k=>(L[st.lang]||L.en)[k]||L.en[k]||k;
          /* Knowledge base. Error-code meanings differ by brand/model: always confirm with the service manual. */
          const E=[
          {a:'AC',k:'ac split window error e6 communication combination',n:'E6 – Communication / combination error (generic)',m:'Meaning depends on brand. On many split ACs it points to indoor–outdoor communication or an indoor fan/sensor problem.',c:['Loose or burnt signal wire between indoor and outdoor','Faulty indoor or outdoor PCB','Low or unstable supply voltage','Faulty fan motor or sensor (brand specific)'],p:'Indoor/outdoor PCB, signal wire, fan motor',s:['Look up E6 in the model service manual','Switch off 5 minutes, restart','Check terminals and signal wire for looseness or burn marks','Measure supply voltage at the outdoor unit','Swap-test the PCB if a known good one is available'],f:'Repair the wiring or replace the confirmed faulty PCB/motor.',w:'Switch off the MCB before opening the unit and discharge capacitors.'},
          {a:'AC',k:'ac error e1 sensor thermistor room temperature',n:'E1 – Sensor fault (generic)',m:'On many models E1 is the room-temperature (or first) sensor open/short. Some brands use it for communication.',c:['Sensor loose or out of its holder','Sensor wire cut or corroded','Sensor value drifted','PCB sensor circuit fault'],p:'Room/pipe thermistor, PCB',s:['Re-seat the sensor connector','Measure sensor resistance (about 10k or 5k at 25°C – check manual)','Compare with a new sensor','Check PCB header for burn marks'],f:'Replace the sensor; replace PCB only if the sensor is good.',w:'Power off before touching connectors.'},
          {a:'AC',b:'Haier',k:'haier ac error e2 sensor pipe coil temperature thermistor indoor evaporator',n:'Haier E2 – Indoor coil (pipe) sensor fault',m:'The indoor coil (evaporator pipe) temperature sensor is open, shorted or not reading correctly. The control board cannot read the coil temperature, so the AC may not run properly.',c:['Sensor connector loose or out of its holder','Sensor wire cut, corroded or wet','Sensor value drifted or open/short','Indoor PCB sensor circuit fault','Iced-up coil (low gas or dirty filter) can trigger a similar protection'],p:'Indoor coil (pipe) thermistor, indoor PCB',s:['Switch off, wait 2 minutes, restart and see if E2 returns','Re-seat the sensor connector on the indoor PCB and check the holder','Measure sensor resistance (compare with a new sensor or the manual chart)','Check the coil for ice; clean filter and check gas if it freezes','Inspect the PCB sensor header for burn marks'],f:'Replace the faulty sensor; replace the indoor PCB only if a good sensor still shows E2.',w:'Switch off the MCB before touching connectors.'},
          {a:'AC',k:'ac error e2 sensor zero crossing generic',n:'E2 – Sensor / signal fault (generic, other brands)',m:'E2 differs by brand: often a pipe or room temperature sensor fault, and on some mini-split makes a zero-crossing signal error. Check the brand manual.',c:['Sensor fault or loose connector','Indoor PCB fault','Unstable power supply (zero-crossing models)'],p:'Temperature sensor, indoor PCB',s:['Restart the AC','Check sensor connectors and wires','Measure sensor resistance','Check supply voltage'],f:'Replace the confirmed faulty sensor or PCB.',w:'Power off before opening.'},
          {a:'AC',k:'ac error f1 outdoor sensor ambient protection',n:'F1 – Sensor / protection fault (generic)',m:'Varies by brand: often an outdoor or pipe sensor fault, or a compressor/drive protection.',c:['Outdoor sensor fault','Wiring problem to outdoor board','Gas or airflow problem (protection)'],p:'Outdoor sensor, outdoor PCB',s:['Check the manual for F1 on this model','Inspect outdoor sensors and connectors','Check outdoor coil is clean and fan runs','Check gas pressure if the code returns'],f:'Replace faulty sensor or board.',w:'Do not bypass protections.'},
          {a:'AC',k:'ac error p4 inverter compressor drive protection',n:'P4 – Inverter / drive protection (generic)',m:'On many inverter ACs a P-code means the outdoor drive board or compressor is in protection.',c:['Dirty outdoor coil or blocked airflow','Compressor winding or drive fault','Low or high voltage','Gas overcharge or leakage'],p:'Inverter board, compressor, outdoor fan',s:['Clean the outdoor coil, check fan motor','Check voltage under load','Measure compressor winding resistance','Check refrigerant pressure'],f:'Fix airflow or voltage first, then repair/replace board or compressor.',w:'High voltage and pressure inside – use insulated tools and gauges.'},
          {a:'AC',b:'Daikin',k:'daikin ac error u4 communication',n:'Daikin U4 – Indoor/outdoor communication error',m:'Indoor and outdoor units are not communicating.',c:['Loose or damaged connecting wire','Faulty indoor or outdoor PCB','Noise or voltage problem'],p:'Connecting wire, PCBs',s:['Check wiring terminals 1-2-3 for matching colours','Check wire for damage','Check supply voltage','Test PCBs'],f:'Correct wiring or replace the faulty PCB.',w:'Power off before checking terminals.'},
          {a:'AC',b:'Daikin',k:'daikin ac error e6 compressor lock stall',n:'Daikin E6 – Compressor start-up / lock error',m:'The compressor fails to start or stalls.',c:['Compressor mechanically stuck or weak','Low voltage','Inverter board fault','Gas problem'],p:'Compressor, inverter board',s:['Check voltage','Check winding resistance','Check stop valves are open','Check gas level'],f:'Repair the cause; replace compressor or board if faulty.',w:'Compressor terminals can hold dangerous voltage.'},
          {a:'AC',b:'Daikin',k:'daikin ac error a3 drain water level',n:'Daikin A3 – Drain abnormal',m:'Drain water level is too high.',c:['Blocked drain pipe','Drain pump failure (cassette)','Float switch fault'],p:'Drain pump, float switch',s:['Clear the drain pipe','Test pump and float switch','Check pipe slope'],f:'Clean drain; replace pump or switch.'},
          {a:'AC',b:'LG',k:'lg ac error ch05 communication indoor outdoor',n:'LG CH05 – Indoor/outdoor communication',m:'Indoor unit is not receiving a signal from the outdoor unit.',c:['Wiring loose or wrong','Outdoor PCB fault','Indoor PCB fault','Voltage problem'],p:'Connecting wire, PCBs',s:['Check the wiring and terminals','Check outdoor supply','Test PCBs'],f:'Fix wiring or replace the faulty PCB.',w:'Power off before opening.'},
          {a:'AC',k:'ac not cooling weak cooling problem symptom',n:'AC not cooling',m:'Common symptom; many causes.',c:['Dirty filter or coil','Low gas (leak)','Faulty capacitor or fan','Compressor not running','Sensor fault'],p:'Capacitor, fan motor, gas, sensor',s:['Clean filters and coils','Check the outdoor unit runs','Check capacitor and fan','Check gas pressure and leaks','Check sensor value'],f:'Clean, fix the leak and recharge, or replace the faulty part.',w:'Use proper gas handling and gauges.'},
          {a:'AC',k:'ac water leakage dripping indoor unit',n:'AC water leakage',m:'Water drips from the indoor unit.',c:['Blocked drain pipe','Wrong pipe slope','Dirty coil or filter causing ice','Low gas'],p:'Drain pipe, tray',s:['Clean the drain tray and pipe','Check the slope','Clean filter and coil','Check gas level'],f:'Clear and re-slope the drain; clean the unit.'},
          {a:'Washing machine',b:'LG',k:'lg washing machine error ie water inlet',n:'LG IE – Water inlet error',m:'Water is not filling in the expected time.',c:['Tap closed or low pressure','Inlet hose blocked','Inlet valve fault','Pressure sensor fault'],p:'Inlet valve, filter, pressure sensor',s:['Open the tap, check the hose','Clean the inlet filter','Test valve coil resistance','Check pressure sensor'],f:'Clean or replace the inlet valve.',w:'Unplug before opening.'},
          {a:'Washing machine',b:'LG',k:'lg washing machine error oe drain',n:'LG OE – Drain error',m:'Water is not draining.',c:['Blocked drain hose or filter','Drain pump fault'],p:'Drain pump, filter',s:['Clean the drain filter','Check the hose','Test pump'],f:'Clear the blockage or replace the pump.',w:'Unplug and keep a towel – water will spill.'},
          {a:'Washing machine',b:'LG',k:'lg washing machine error ue unbalance load',n:'LG UE – Unbalanced load',m:'Clothes are unevenly distributed.',c:['Small or heavy single item','Machine not level','Worn suspension'],p:'Suspension, feet',s:['Redistribute the load','Level the machine','Check suspension'],f:'Reload, level, or replace the suspension.'},
          {a:'Washing machine',b:'Samsung',k:'samsung washing machine error 4e 4c water supply',n:'Samsung 4E / 4C – Water supply error',m:'Not enough water is coming in.',c:['Tap closed','Blocked inlet filter','Inlet valve fault'],p:'Inlet valve',s:['Open the tap','Clean the inlet filter','Test the valve'],f:'Clean the filter or replace the valve.'},
          {a:'Washing machine',b:'Samsung',k:'samsung washing machine error 5e 5c drain',n:'Samsung 5E / 5C – Drain error',m:'Water is not draining.',c:['Blocked filter or hose','Drain pump fault'],p:'Drain pump',s:['Clean the filter','Check the hose','Test pump'],f:'Clear the blockage or replace the pump.'},
          {a:'Refrigerator',k:'refrigerator fridge not cooling whirlpool samsung lg godrej',n:'Refrigerator not cooling',m:'Fridge or freezer is warm.',c:['Dirty condenser','Faulty relay or overload','Fan motor not running','Defrost heater or sensor fault','Gas leak'],p:'Relay/overload, fan motor, defrost sensor, thermostat',s:['Check the compressor starts','Clean the condenser','Check evaporator fan','Check defrost heater and sensor','Check for frost build-up'],f:'Replace the faulty relay, fan, sensor or heater.',w:'Unplug before touching the relay and wiring.'},
          {a:'Geyser',k:'geyser water heater not heating electric instant storage',n:'Geyser not heating',m:'No hot water.',c:['Heating element burnt','Thermostat failure','Loose or burnt wiring','Tripped thermal cut-out'],p:'Heating element, thermostat, cut-out',s:['Check supply and MCB','Check the indicator light','Test element continuity','Test thermostat and cut-out'],f:'Replace the element or thermostat.',w:'Disconnect power and ensure earthing before repair.'}];
          /* More codes from compact tables. Each category supplies causes, parts, steps, fix and safety text. Add rows here to grow the database. */
          const CT={
          sensor:{c:['Sensor connector loose','Wire cut or corroded','Sensor open/short or drifted','PCB sensor circuit fault'],p:'Sensor / thermistor, PCB',s:['Power off, re-seat the connector','Measure resistance against the manual chart','Compare with a new sensor','Inspect the PCB header for burn marks'],f:'Replace the faulty sensor; replace the PCB only if a good sensor still shows the error.',w:'Power off before touching connectors.'},
          comm:{c:['Loose, wrong or burnt signal wire','Indoor or outdoor PCB fault','Low or unstable voltage','Earthing or noise problem'],p:'Signal wire, indoor/outdoor PCB',s:['Check terminals and colour matching','Check wire continuity and insulation','Measure supply voltage at both units','Swap-test the PCBs'],f:'Correct the wiring or replace the faulty PCB.',w:'Switch off the MCB before opening the unit.'},
          fan:{c:['Fan blade stuck or dirty','Motor winding or capacitor weak','Loose connector','PCB fan driver fault'],p:'Fan motor, capacitor, PCB',s:['Turn the fan by hand','Check capacitor and winding resistance','Check connector and voltage to the motor','Test the PCB output'],f:'Replace the motor or capacitor, or repair the PCB.',w:'Keep hands away from the fan; power off.'},
          comp:{c:['Low or high supply voltage','Dirty coil or poor airflow','Compressor winding fault or seized','Inverter board fault','Gas too low or too high'],p:'Compressor, inverter board, capacitor',s:['Check voltage under load','Clean the outdoor coil, check the fan','Measure compressor winding resistance','Check refrigerant pressure','Test the inverter board'],f:'Fix airflow or voltage first; then repair or replace the board or compressor.',w:'High voltage and pressure inside – use insulated tools and gauges.'},
          gas:{c:['Refrigerant leak','Joint or flare leak','Choked capillary / filter drier','Under-charge'],p:'Pipes, flare joints, drier, gas',s:['Check pressure with gauges','Leak-test joints and coils with nitrogen or detector','Check for frost on pipes','Check for choke'],f:'Repair the leak, evacuate and recharge to the nameplate quantity.',w:'Handle refrigerant with proper equipment; wear gloves and goggles.'},
          press:{c:['Blocked or dirty condenser','Outdoor fan not running','Overcharge','Air or non-condensables in the system'],p:'Condenser, fan motor, gas charge',s:['Clean the condenser coil','Check the outdoor fan and capacitor','Check pressure against the chart','Recover gas if overcharged'],f:'Clean the coil, repair the fan or correct the charge.',w:'High-pressure refrigerant – use gauges and protection.'},
          pcb:{c:['Faulty or corrupted PCB / EEPROM','Moisture or burn marks on the board','Power surge'],p:'Indoor or outdoor PCB, EEPROM',s:['Power off for 5 minutes and restart','Inspect the board for moisture or burn marks','Check supply voltage','Replace PCB with a model-matched board'],f:'Replace the PCB with the correct part number.',w:'Discharge capacitors and use anti-static care.'},
          drain:{c:['Blocked drain pipe or tray','Drain pump failure','Float switch fault','Wrong pipe slope'],p:'Drain pump, float switch, pipe',s:['Clear the drain pipe and tray','Test the pump and float switch','Check the pipe slope'],f:'Clean the drain; replace the pump or switch.'},
          power:{c:['Low or high mains voltage','Loose power connection','Faulty rectifier or DC link capacitor'],p:'Voltage stabiliser, PCB, DC link capacitor',s:['Measure voltage at the unit','Check terminal tightness','Check the DC link capacitor and rectifier'],f:'Correct the supply, or repair the board.',w:'Capacitors hold charge – discharge before touching.'},
          freeze:{c:['Dirty filter or coil','Low gas','Indoor fan running slow','Room too cold / sensor fault'],p:'Filter, fan motor, gas, sensor',s:['Clean the filter and evaporator','Check the indoor fan speed','Check gas level','Check the coil sensor'],f:'Clean, fix the airflow or gas problem; let the ice melt before restarting.'},
          temp:{c:['Low gas or restriction','Dirty condenser','Fan problem','Discharge or fin sensor fault','Compressor overheating'],p:'Gas, condenser, fan, sensor',s:['Clean the condenser and check the fan','Check gas pressure','Check the sensor value','Let the unit cool, then restart'],f:'Correct airflow or gas; replace the faulty sensor.',w:'Hot parts – wait for cooling before touching.'},
          door:{c:['Door not closed or clothes caught','Door lock or switch faulty','Wiring loose'],p:'Door lock, switch, wiring',s:['Close the door firmly','Check the lock and switch continuity','Check the connector'],f:'Replace the door lock or switch.',w:'Unplug before opening panels.'},
          motor:{c:['Overloaded drum','Motor or carbon brushes worn','Hall sensor or tacho fault','Control board fault'],p:'Motor, hall sensor, control board',s:['Reduce the load and turn the drum by hand','Check motor connector and winding','Test the hall sensor','Test the board'],f:'Replace the faulty motor part or board.',w:'Unplug the machine first.'},
          water:{c:['Tap or inlet filter blocked','Inlet valve or pressure sensor fault','Drain not closed (siphoning)'],p:'Inlet valve, pressure sensor',s:['Check water supply and filter','Test the valve and the sensor','Check the drain hose height'],f:'Clean or replace the valve or sensor.',w:'Unplug before opening.'},
          unbal:{c:['Load unevenly distributed','Machine not level','Worn suspension or dampers'],p:'Suspension, dampers, feet',s:['Redistribute the load','Level the machine','Check the suspension'],f:'Reload, level, or replace the suspension.'},
          heater:{c:['Heating element burnt','Thermistor fault','Loose wiring'],p:'Heater element, thermistor',s:['Test the element continuity','Check the thermistor','Check the connector'],f:'Replace the element or thermistor.',w:'Unplug before testing.'},
          leak:{c:['Hose or tub seal leak','Leak sensor wet or faulty','Overfill'],p:'Hoses, seals, leak sensor',s:['Check hoses and clamps','Dry and test the sensor','Check for overfill'],f:'Repair the leak or replace the sensor.',w:'Unplug before opening.'}};
          const NT='Commonly reported meaning – may differ by model series. Confirm in the service manual.';
          const TB=[['Daikin','AC','',[['A1','pcb','Indoor unit PCB fault'],['A5','freeze','Anti-freeze / high-pressure control'],['A6','fan','Indoor fan motor overload or lock'],['C4','sensor','Indoor heat exchanger thermistor fault'],['C9','sensor','Room temperature thermistor fault'],['E1','pcb','Outdoor unit PCB fault'],['E3','press','High pressure protection'],['E4','gas','Low pressure / refrigerant shortage protection'],['E5','comp','Compressor motor lock'],['E7','fan','Outdoor fan motor fault'],['E8','comp','Input over-current'],['F3','temp','Discharge pipe temperature abnormal'],['H6','comp','Compressor position detection fault'],['H9','sensor','Outdoor air thermistor fault'],['J3','sensor','Discharge pipe thermistor fault'],['J6','sensor','Outdoor heat exchanger thermistor fault'],['L4','temp','Radiator fin temperature rise'],['L5','comp','Inverter over-current'],['P4','sensor','Radiator fin thermistor fault'],['U0','gas','Refrigerant shortage'],['U2','power','Power supply voltage abnormal'],['UA','comm','Indoor/outdoor unit combination mismatch']]],
          ['LG','AC',NT,[['CH01','sensor','Indoor room thermistor fault'],['CH02','sensor','Indoor pipe (inlet) thermistor fault'],['CH03','comm','Remote controller / display communication fault'],['CH04','drain','Drain pump / water level fault'],['CH06','sensor','Indoor pipe (outlet) thermistor fault'],['CH07','comm','Indoor/outdoor operation mode mismatch'],['CH09','pcb','EEPROM / PCB data error'],['CH10','fan','Indoor BLDC fan motor lock'],['CH21','comp','DC peak / IPM fault'],['CH22','comp','Compressor over-current'],['CH23','power','DC link voltage abnormal'],['CH26','comp','Compressor position error'],['CH29','comp','Compressor over-current'],['CH32','temp','Compressor discharge pipe overheat']]],
          ['Voltas','AC',NT+' Sources disagree for Voltas.',[['E1','comm','Indoor/outdoor communication, indoor coil sensor or high-pressure protection (series differ)'],['E2','freeze','Anti-freeze protection (indoor coil too cold)'],['E3','gas','Low pressure / refrigerant leak'],['E4','temp','Discharge temperature / high-pressure protection'],['E5','comp','Compressor overload / over-current']]],
          ['Haier','AC',NT,[['E1','sensor','Temperature sensor fault'],['F1','comm','Indoor/outdoor communication error'],['EC','gas','Refrigerant leakage detected']]],
          ['Samsung','AC',NT,[['E1','sensor','Indoor room temperature sensor fault'],['E4','temp','High discharge temperature']]],
          ['Blue Star','AC',NT,[['F3','sensor','Outdoor sensor fault']]],
          ['LG','Washing machine',NT,[['dE','door','Door open / lock error'],['LE','motor','Motor locked / motor error'],['PE','water','Water level (pressure) sensor error'],['FE','water','Overfill – too much water'],['tE','heater','Heater / thermistor error']]],
          ['Samsung','Washing machine',NT,[['UE','unbal','Unbalanced load'],['DC','door','Door not closed / lock fault'],['LC','leak','Water leak detected'],['HE','heater','Heater / water heating fault'],['3E','motor','Motor / speed sensing fault']]]];
          TB.forEach(([b,a,nt,l])=>l.forEach(([c,k,m])=>E.push({a,b,k:(b+' '+a+' error '+c+' '+m+' '+k).toLowerCase(),n:b+' '+c+' – '+m,m:m+'.',...CT[k],w:(nt?nt+' ':'')+(CT[k].w||'')})));
          function find(q){const w=q.toLowerCase().split(/\s+/).filter(Boolean);return E.map(e=>{const h=(e.k+' '+e.n+' '+e.m).toLowerCase(),ks=e.k.split(' ');let s=0;for(const x of w)if(h.includes(x))s+=ks.includes(x)?3:1;return [s,e]}).filter(r=>r[0]>0).sort((a,b)=>b[0]-a[0]).map(r=>r[1])}
          const li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
          const card=e=>`<details class="card"><summary>${e.n}</summary><p class="mut"><span class="tag">${e.a}</span>${e.b?'<span class="tag">'+e.b+'</span>':''}</p><p>${e.m}</p><b>Possible causes</b>${li(e.c)}<b>Parts that may be faulty</b><p>${e.p}</p><b>Troubleshooting steps</b>${li(e.s)}<b>Recommended solution</b><p>${e.f}</p>${e.w?'<div class="warn">⚠ '+e.w+'</div>':''}</details>`;
          /* Demo spare-parts shops (positions in km relative to you). Replace with real registered shops from a server. */
          let CS=[],pos=null; // CS = shops from the cloud, pos = my GPS position
          function shopsList(){return window.Cloud&&Cloud.on&&CS.length&&pos?CS.map(s=>({...s,x:(s.lon-pos.lon)*111*Math.cos(pos.lat*Math.PI/180),y:-(s.lat-pos.lat)*111})):SH}
          const SH=[{n:'Sharma Cooling Spares',k:'AC',x:.8,y:-.4,ph:'9810000001',h:'9am–8pm',p:[['AC capacitor 35+5µF','CAP-35','₹180','Universal',1],['Indoor fan motor','FM-LG1','₹1450','LG, Samsung',1],['Split AC PCB','PCB-DK2','₹3200','Daikin',0]]},
          {n:'Kumar Fridge Parts',k:'Fridge',x:-1.2,y:.6,ph:'9810000002',h:'10am–7pm',p:[['Relay + overload','RO-WP','₹350','Whirlpool, Godrej',1],['Defrost sensor','DS-SM','₹220','Samsung',1]]},
          {n:'Wash World Spares',k:'Washer',x:1.9,y:1.2,ph:'9810000003',h:'9am–6pm',p:[['Water inlet valve','WIV-LG','₹520','LG, Samsung',1],['Drain pump','DP-LG','₹980','LG',1]]},
          {n:'Hot Spot Geyser Parts',k:'Geyser',x:-.5,y:-1.7,ph:'9810000004',h:'10am–8pm',p:[['Geyser heating element 2kW','HE-2K','₹450','Racold, Bajaj',1],['Geyser thermostat','TH-G1','₹180','Universal',1]]},
          {n:'Raj Electronics Components',k:'Electronic',x:2.6,y:-.9,ph:'9810000005',h:'10am–9pm',p:[['Capacitor 35+5µF','CAP-35','₹160','Universal',1],['Thermistor 10k sensor','SN-10K','₹60','Universal',1]]}];
          let scr='home',q='',fl='All',pq='',gf='AC',me=false,sb=null; // sb = selected AC brand
          const BR=['Samsung','LG','Daikin','Voltas','Blue Star','Hitachi','Carrier','Panasonic','Lloyd','Godrej','Whirlpool','Haier','O General','Mitsubishi','Other'];
          function pick(){return '<h3>Select AC brand</h3><div class="grid">'+BR.map(b=>`<button class="big" style="min-height:64px" data-b="${b}" onclick="sb=this.dataset.b==='Other'?'All':this.dataset.b;q='';draw()">${b}</button>`).join('')+`</div><button class="btn g" style="margin-top:12px;width:100%" onclick="sb='All';q='';draw()">All brands / all appliances</button>`}
          const toast=s=>{const e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2200)};
          const go=s=>{if(s==='search')sb=null;scr=s;draw()};
          function head(){return `<div class="top">${scr!=='home'?`<button class="btn g s" onclick="go('home')">← ${t('back')}</button>`:''}<h1>🔧 TechFix</h1><button class="btn g s" onclick="st.lang=st.lang==='en'?'hi':'en';save();draw()">${st.lang==='en'?'हिंदी':'English'}</button></div>`}
          const V={
          home(){return `<div class="grid">${[['search','🔍','ac'],['guide','📖','guide'],['shops','📍','parts'],['find','📋','find'],['my','🛠️','my'],['prof','👤','prof'],['book','🏠','book'],['shopreg','🏪','shop']].map(b=>`<button class="big" onclick="go('${b[0]}')"><span>${b[1]}</span>${t(b[2])}</button>`).join('')}</div><p class="mut">Demo prototype: sample data, saved on this device only.</p>`},
          search(){if(sb===null)return pick();return `<p><b>Brand: ${sb==='All'?'All brands':sb}</b> <button class="btn g s" onclick="sb=null;draw()">Change brand</button></p><input id="q" value="${q}" placeholder="${t('ph')}" oninput="q=this.value;$('#res').innerHTML=R()" autofocus><div id="res">${R()}</div>`},
          guide(){const ty={AC:'Split, Window, Inverter, Non-inverter, Cassette, Commercial','Washing machine':'Semi-automatic, Fully automatic, Top-load, Front-load',Refrigerator:'Single-door, Double-door, Side-by-side, Inverter',Geyser:'Electric, Instant, Storage'};return `<div class="chips">${Object.keys(ty).map(a=>`<span class="chip ${gf===a?'on':''}" onclick="gf='${a}';draw()">${a}</span>`).join('')}</div><p class="mut">${ty[gf]}</p>${E.filter(e=>e.a===gf).map(card).join('')}`},
          shops(){const kinds=['All','AC','Fridge','Washer','Geyser','Electronic'];let d=shopsList().map(s=>({...s,d:Math.hypot(s.x,s.y)})).sort((a,b)=>a.d-b.d);
          const pm=pq?d.map(s=>({...s,m:s.p.filter(p=>(p[0]+' '+p[1]+' '+p[3]).toLowerCase().includes(pq.toLowerCase()))})).filter(s=>s.m.length):d.filter(s=>fl==='All'||s.k===fl);
          const dots=pm.map((s,i)=>`<circle cx="${150+s.x*38}" cy="${100+s.y*38}" r="9" fill="#e5533d"/><text x="${150+s.x*38}" y="${104+s.y*38}" font-size="11" text-anchor="middle" fill="#fff" style="fill:#fff">${i+1}</text>`).join('');
          return `<button class="btn g s" onclick="loc()">📍 ${me?'Location found':'Use my location'}</button><input placeholder="Search a part (e.g. capacitor, LG valve)" value="${pq}" oninput="pq=this.value;draw();$('input').focus()"><div class="chips">${kinds.map(k=>`<span class="chip ${fl===k?'on':''}" onclick="fl='${k}';pq='';draw()">${k}</span>`).join('')}</div>
          <svg viewBox="0 0 300 200" width="100%" class="card" style="padding:0"><rect width="300" height="200" rx="14" fill="#cfe9e2"/><path d="M0 120H300M150 0V200" stroke="#fff" stroke-width="8"/><circle cx="150" cy="100" r="9" fill="#0b6bcb" stroke="#fff" stroke-width="3"/><text x="150" y="124" font-size="11" text-anchor="middle" style="fill:#14213d">You</text>${dots}</svg><p class="mut">Schematic map with demo shops. A real map needs a map SDK and a shop database.</p>
          ${pm.map((s,i)=>`<div class="card"><b>${i+1}. ${s.n}</b> <span class="tag">${s.k}</span><div class="mut">${s.d.toFixed(1)} km · ${s.h}</div>${(s.m||s.p).map(p=>`<div class="mut">• ${p[0]} (${p[1]}) ${p[2]} – ${p[3]} – ${p[4]?'In stock':'Out of stock'}</div>`).join('')}<a class="btn s" href="tel:${s.ph}">📞 Call</a></div>`).join('')||'<p>No shop found.</p>'}`},
          book(){return `<div class="card"><b>Request a technician</b><select id="ba">${['Air conditioner','Refrigerator','Washing machine','Geyser'].map(x=>`<option>${x}</option>`).join('')}</select><select id="bs">${['AC repair','AC installation','AC servicing','AC gas charging','AC water leakage','AC not cooling','AC error code','AC PCB repair','AC compressor problem','AC cleaning','AC uninstallation','Other repair'].map(x=>`<option>${x}</option>`).join('')}</select><input id="bn" placeholder="Your name"><input id="bp" placeholder="Phone" type="tel"><textarea id="bd" placeholder="Address / landmark"></textarea><button class="btn" onclick="book()">Send request</button></div>`},
          find(){const n=st.jobs.filter(j=>j.s==='New');return n.map(j=>`<div class="card"><b>${j.sv}</b> <span class="tag">${j.ap}</span><div class="mut">${j.nm} · ${j.ad}</div><div class="row"><button class="btn ok s" onclick="setS(${j.id},'Accepted')">Accept</button><button class="btn bad s" onclick="setS(${j.id},'Rejected')">Reject</button></div></div>`).join('')||'<p>No new jobs nearby right now.</p>'},
          my(){const m=st.jobs.filter(j=>['Accepted','On the way','Working','Completed'].includes(j.s)&&(!window.Cloud||!Cloud.on||j.tech===Cloud.uid));return m.map(j=>{const pt=(j.parts||[]).reduce((a,p)=>a+p.p,0),tot=pt+(+j.lab||0);return `<div class="card"><b>${j.sv}</b> <span class="tag">${j.ap}</span> <span class="tag">${j.s}</span><div class="mut">${j.nm} · ${j.ad}</div>
          <div class="row"><a class="btn g s" href="tel:${j.ph}">📞 Call</a><a class="btn g s" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.ad)}">🧭 Navigate</a></div>
          ${j.s!=='Completed'?`<select onchange="setS(${j.id},this.value)">${['Accepted','On the way','Working','Completed'].map(x=>`<option ${x===j.s?'selected':''}>${x}</option>`).join('')}</select>`:''}
          <input placeholder="Problem found" value="${j.pr||''}" onchange="J(${j.id}).pr=this.value;save()">
          <div class="row"><input id="pn${j.id}" placeholder="Part used"><input id="pp${j.id}" placeholder="Price ₹" type="number"><button class="btn s" onclick="addP(${j.id})">Add</button></div>${(j.parts||[]).map(p=>`<div class="mut">• ${p.n} ₹${p.p}</div>`).join('')}
          <input placeholder="Labour charges ₹" type="number" value="${j.lab||''}" onchange="J(${j.id}).lab=this.value;draw()">
          <div class="card"><b>Bill</b><div class="mut">Parts ₹${pt}<br>Labour ₹${+j.lab||0}</div><b>Total ₹${tot}</b></div>
          ${j.s==='Completed'&&!j.rated?`<div class="card"><b>Customer rating</b><select id="rs${j.id}">${[5,4,3,2,1].map(x=>`<option value="${x}">${'★'.repeat(x)}</option>`).join('')}</select><input id="rv${j.id}" placeholder="Review / feedback"><button class="btn s" onclick="rate(${j.id})">Submit</button></div>`:''}</div>`}).join('')||'<p>No jobs yet. Accept one from “Find customer jobs”.</p>'},
          prof(){const p=st.prof,r=p.reviews,av=r.length?(r.reduce((a,x)=>a+x.s,0)/r.length).toFixed(1):'–';return `<div class="card">${[['name','Name'],['phone','Phone'],['area','Service area'],['skills','Skills / appliances'],['exp','Experience (years)']].map(f=>`<label class="mut">${f[1]}</label><input value="${p[f[0]]}" onchange="st.prof['${f[0]}']=this.value;save()">`).join('')}</div><div class="card"><b>⭐ ${av}</b> (${r.length} reviews) · ${p.done} jobs completed${r.map(x=>`<div class="mut">${'★'.repeat(x.s)} ${x.t}</div>`).join('')}</div>`}};
          const R=()=>{const ok=e=>sb==='All'||(e.a==='AC'&&(!e.b||e.b===sb));
            if(q.trim()){const r=find(q).filter(ok),nb=sb!=='All'&&!r.some(e=>e.b===sb);
              return (nb?'<div class="warn">⚠ No verified entry for <b>'+sb+'</b> yet. These are generic AC results – the real meaning can be different for this brand. Please check the brand service manual.</div>':'')+(r.map(card).join('')||'<p>No result. Try only the code (e.g. E6) or choose All brands.</p>')}
            const own=E.filter(e=>e.b===sb);return '<p class="mut">Now type the error code or problem (e.g. E6, CH05, not cooling).</p>'+(own.length?'<b>Known codes for '+sb+'</b>'+own.map(card).join(''):(sb==='All'?'':'<p class="mut">No brand-specific codes added yet. Generic AC codes will be shown.</p>'))};
          V.login=()=>`<div class="card"><b>Sign in / create account</b><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password (min 6 characters)"><button class="btn" onclick="Cloud.signIn($('#le').value,$('#lp').value).catch(e=>toast(e.message))">Continue</button></div>`;
          V.shopreg=()=>!(window.Cloud&&Cloud.on)?'<p>Shop registration needs the cloud setup (see README).</p>':`<div class="card"><b>Register your shop</b><input id="sn" placeholder="Shop name"><select id="sk">${['AC','Fridge','Washer','Geyser','Electronic'].map(x=>'<option>'+x+'</option>').join('')}</select><input id="sph" placeholder="Phone" type="tel"><input id="sh" placeholder="Opening hours, e.g. 9am-8pm"><textarea id="sp" placeholder="Parts, one per line: name|part number|price|brands|1 (in stock) or 0"></textarea><p class="mut">Your shop is placed at your current location.</p><button class="btn" onclick="regShop()">Register</button></div>`;
          function regShop(){const f=id=>$('#'+id).value;navigator.geolocation.getCurrentPosition(p=>{const parts=f('sp').split('\n').filter(Boolean).map(l=>{const a=l.split('|');return [a[0],a[1]||'',a[2]||'',a[3]||'',a[4]==='0'?0:1]});Cloud.addShop({n:f('sn'),k:f('sk'),ph:f('sph'),h:f('sh'),p:parts,lat:p.coords.latitude,lon:p.coords.longitude}).then(()=>{toast('Shop registered');go('home')}).catch(e=>toast(e.message))},()=>toast('Allow location to place your shop on the map'))}
          let cloudStarted=false;
          window.cloudAuth=u=>{if(u&&!cloudStarted){cloudStarted=true;if(scr==='login')scr='home';Cloud.listenJobs(a=>{st.jobs=a;draw()});Cloud.listenShops(a=>{CS=a;draw()})}draw()};
          const J=id=>st.jobs.find(j=>j.id===id);
          function setS(id,s){J(id).s=s;if(s==='Completed')st.prof.done++;save();draw()}
          function addP(id){const n=$('#pn'+id).value,p=+$('#pp'+id).value;if(!n)return;(J(id).parts=J(id).parts||[]).push({n,p});save();draw()}
          function rate(id){const j=J(id);st.prof.reviews.push({s:+$('#rs'+id).value,t:$('#rv'+id).value||'Good service'});j.rated=1;if(window.Cloud&&Cloud.on)Cloud.addReview({tech:j.tech||'',s:+$('#rs'+id).value,t:$('#rv'+id).value||'Good service'});save();draw()}
          function book(){const n=$('#bn').value,p=$('#bp').value,a=$('#bd').value;if(!n||!p||!a)return toast('Fill name, phone and address');st.jobs.push({id:Date.now(),ap:$('#ba').value,sv:$('#bs').value,nm:n,ph:p,ad:a,s:'New'});save();toast('Request sent to nearby technicians');go('home')}
          function loc(){if(!navigator.geolocation)return toast('Location not available');navigator.geolocation.getCurrentPosition(p=>{me=true;pos={lat:p.coords.latitude,lon:p.coords.longitude};draw()},()=>toast('Location blocked – showing demo shops'),{timeout:6000})}
          if(!(window.Cloud&&Cloud.on)&&!st.jobs.length)st.jobs=[{id:1,ap:'Air conditioner',sv:'AC not cooling',nm:'Anita Verma',ph:'9899900001',ad:'12 Garden Road',s:'New'},{id:2,ap:'Washing machine',sv:'Other repair',nm:'Rahul Singh',ph:'9899900002',ad:'45 Market Lane',s:'New'}];
          function draw(){if(window.Cloud&&Cloud.on&&!Cloud.uid)scr='login';$('#app').innerHTML=head()+(navigator.onLine===false?'<div class="warn">📡 Internet is off. Error search and repair guide work without internet; live map, shops and jobs need internet.</div>':'')+V[scr]();window.scrollTo(0,0)}
          addEventListener('online',()=>draw());addEventListener('offline',()=>draw());
          if(window.Cloud)Cloud.init();
          draw();
          </script></body></html>
          EOF_FILE
          mkdir -p $(dirname www/cloud.js)
          cat > www/cloud.js <<'EOF_FILE'
          /* Cloud layer (Firebase compat SDK). Fill FIREBASE_CONFIG from Firebase console > Project settings > Your apps > Web app.
             While apiKey is empty the app stays in offline demo mode. */
          const FIREBASE_CONFIG={apiKey:'',authDomain:'',projectId:'',appId:''};
          const Cloud={on:false,uid:null,last:{},
          init(){if(!FIREBASE_CONFIG.apiKey||typeof firebase==='undefined')return;
            firebase.initializeApp(FIREBASE_CONFIG);this.db=firebase.firestore();this.auth=firebase.auth();this.on=true;
            this.auth.onAuthStateChanged(u=>{this.uid=u?u.uid:null;if(window.cloudAuth)window.cloudAuth(u)})},
          /* Email + password. Creates the account on first use. (Phone OTP needs a native Capacitor Firebase plugin – later.) */
          signIn(e,p){return this.auth.signInWithEmailAndPassword(e,p).catch(x=>['auth/user-not-found','auth/invalid-credential'].includes(x.code)?this.auth.createUserWithEmailAndPassword(e,p):Promise.reject(x))},
          signOut(){return this.auth.signOut()},
          /* Jobs are shared live: every technician sees New jobs; the accepting technician owns the job afterwards. */
          listenJobs(cb){return this.db.collection('jobs').orderBy('t','desc').limit(100).onSnapshot(s=>{const a=s.docs.map(d=>d.data());a.forEach(j=>this.last[j.id]=JSON.stringify(j));cb(a)},e=>console.error(e))},
          syncJobs(jobs){if(!this.on||!this.uid)return;
            jobs.forEach(j=>{if(!j.cust)j.cust=this.uid;if(!j.t)j.t=Date.now();if(j.s!=='New'&&!j.tech)j.tech=this.uid;
              const x=JSON.stringify(j);if(this.last[j.id]!==x){this.last[j.id]=x;this.db.collection('jobs').doc(String(j.id)).set(j).catch(e=>console.error(e))}})},
          listenShops(cb){return this.db.collection('shops').limit(200).onSnapshot(s=>cb(s.docs.map(d=>d.data())),e=>console.error(e))},
          addShop(s){s.owner=this.uid;return this.db.collection('shops').add(s)},
          addReview(r){return this.db.collection('reviews').add({...r,by:this.uid,t:Date.now()})}};
          EOF_FILE
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: techfix-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
